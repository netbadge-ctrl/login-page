<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      padding: 48px 40px;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #8e8ea0;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #4a4a68;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #e6e6f0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.2s ease;
      background: #fafafa;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: #667eea;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .input-wrapper .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #8e8ea0;
      font-size: 14px;
      padding: 4px;
    }

    .input-wrapper .toggle-password:hover {
      color: #667eea;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4a4a68;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .forgot-password {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-login:hover {
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 28px 0;
      color: #b5b5c8;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e6e6f0;
    }

    .social-login {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1.5px solid #e6e6f0;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      border-color: #667eea;
      background: #fafaff;
    }

    .signup-link {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: #8e8ea0;
    }

    .signup-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .error-msg {
      font-size: 12px;
      color: #e74c3c;
      margin-top: 6px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">U</div>
    <h1>欢迎回来</h1>
    <p class="subtitle">登录你的账号继续使用</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">邮箱或用户名</label>
        <div class="input-wrapper">
          <input type="text" id="email" name="email" placeholder="请输入邮箱或用户名" autocomplete="username" />
        </div>
        <div class="error-msg" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" />
          <button type="button" class="toggle-password" id="togglePwd">显示</button>
        </div>
        <div class="error-msg" id="passwordError"></div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" /> 记住我
        </label>
        <a href="#" class="forgot-password">忘记密码？</a>
      </div>

      <button type="submit" class="btn-login">登 录</button>

      <div class="divider">或使用以下方式</div>

      <div class="social-login">
        <button type="button" class="social-btn" title="微信">💬</button>
        <button type="button" class="social-btn" title="GitHub">🐙</button>
        <button type="button" class="social-btn" title="Google">🔍</button>
      </div>
    </form>

    <p class="signup-link">
      还没有账号？<a href="#">立即注册</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const togglePwd = document.getElementById('togglePwd');

    togglePwd.addEventListener('click', () => {
      const isPwd = passwordInput.type === 'password';
      passwordInput.type = isPwd ? 'text' : 'password';
      togglePwd.textContent = isPwd ? '隐藏' : '显示';
    });

    function validateEmail(val) {
      if (!val.trim()) return '请输入邮箱或用户名';
      if (val.includes('@')) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!re.test(val)) return '邮箱格式不正确';
      }
      return '';
    }

    function validatePassword(val) {
      if (!val) return '请输入密码';
      if (val.length < 6) return '密码至少 6 位';
      return '';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const eErr = validateEmail(emailInput.value);
      const pErr = validatePassword(passwordInput.value);
      emailError.textContent = eErr;
      passwordError.textContent = pErr;

      if (!eErr && !pErr) {
        // 模拟登录
        const btn = form.querySelector('.btn-login');
        btn.textContent = '登录中...';
        btn.disabled = true;
        setTimeout(() => {
          alert('登录成功！');
          btn.textContent = '登 录';
          btn.disabled = false;
        }, 1200);
      }
    });

    [emailInput, passwordInput].forEach((el) => {
      el.addEventListener('input', () => {
        const errorEl = el.id === 'email' ? emailError : passwordError;
        if (errorEl.textContent) errorEl.textContent = '';
      });
    });
  </script>
</body>
</html>
